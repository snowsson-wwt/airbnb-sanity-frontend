name: Forge temporary CI
on: pull_request
permissions:
  contents: read
jobs:
  marker-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Observation interval
        run: sleep 35
      - name: Reject temporary probe file
        run: |
          if test -f PROBE.md; then
            echo '::error file=PROBE.md::Remove forbidden PROBE.md with git rm PROBE.md, then git_commit and git_push. Do not change this workflow or any existing file.'
            exit 1
          fi
          echo 'Probe file check passed'
