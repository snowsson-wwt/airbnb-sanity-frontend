name: Forge temporary CI
on: pull_request
permissions:
  contents: read
jobs:
  marker-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Observation interval
        run: sleep 25
      - name: Reject temporary probes
        run: |
          if test -f PROBE.md; then
            echo '::error file=PROBE.md::Remove forbidden PROBE.md with git rm PROBE.md, then git_commit and git_push. Do not change this workflow or any existing file.'
            exit 1
          fi
          if grep -q FORGE_CI_FAILURE_PROBE README.md; then
            echo '::error file=README.md::Remove only the forbidden FORGE_CI_FAILURE_PROBE line from README.md; keep all other content and do not change this workflow.'
            exit 1
          fi
          echo 'Probe checks passed'
