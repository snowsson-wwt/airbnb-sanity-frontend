name: Forge temporary exact restore CI
on: pull_request
permissions:
  contents: read
jobs:
  exact-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Observation interval
        run: sleep 20
      - name: README must equal base byte for byte
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git show "$BASE_SHA:README.md" > /tmp/base-readme
          if grep -q FORGE_RESTORE_PROBE README.md || ! cmp -s README.md /tmp/base-readme; then
            echo '::error file=README.md::README.md must match main byte for byte. Undo the README change without altering any other file or weakening this workflow.'
            exit 1
          fi
          echo 'README matches main byte for byte'
